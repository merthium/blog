
baseURL = "https://blog.linkola.workers.dev/"
title = "Blog of Linkola"
theme = "PaperMod"

defaultContentLanguage = "tr"
locale = "tr-TR"
timeZone = "Europe/Istanbul"
enableRobotsTXT = true

[markup.highlight]
  noClasses = false
  codeFences = true
  lineNos = false

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  comments = true
  turnstileSiteKey = "0x4AAAAAAF36i1ENMrvTAtbI"

  defaultTheme = "dark"
  disableThemeToggle = true

  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false

  description = "Computer & Network Engineering ve Reverse Engineering alanında writeuplar ve tutorialler."

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 1

  [[menus.main]]
    name = "Categories"
    pageRef = "/categories"
    weight = 2

  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 3

  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 4

[pagination]
  pagerSize = 10

# Publish restore: rebuild from current GitHub content

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menus.main]]
  identifier = "search"
  name = "Ara"
  pageRef = "/search"
  weight = 5

[[menus.main]]
  identifier = "rss"
  name = "RSS"
  url = "/index.xml"
  weight = 6

[related]
  includeNewer = true
  threshold = 30
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 70
