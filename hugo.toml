
baseURL = "https://blog.linkola.workers.dev/"
title = "Blog of Linkola"
theme = "PaperMod"

defaultContentLanguage = "tr"
locale = "tr-TR"
timeZone = "Europe/Istanbul"
enableRobotsTXT = true

[markup.highlight]
  noClasses = false
  codeFences = true
  lineNos = false

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  comments = true
  turnstileSiteKey = "0x4AAAAAAF36i1ENMrvTAtbI"

  defaultTheme = "dark"
  disableThemeToggle = true

  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false

  description = "Computer & Network Engineering ve Reverse Engineering alanında writeuplar ve tutorialler."

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 1

  [[menus.main]]
    name = "Categories"
    pageRef = "/categories"
    weight = 2

  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 3

  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 4

[pagination]
  pagerSize = 10

# Publish restore: rebuild from current GitHub content
